# Render.com blueprint: New → Blueprint → pick this repository.
# The disk keeps the database between deploys (disks need a paid instance).
services:
  - type: web
    name: bari
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/config
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SMS_MODE
        value: demo
      - key: ADMIN_PHONES
        sync: false
      - key: OTP_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: SIMULATE
        value: "1"
