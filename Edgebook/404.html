    .glow { position: fixed; width: 900px; height: 600px; left: 50%; top: 58%; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(168, 85, 247, .28), transparent); filter: blur(30px); pointer-events: none; }

    .logo b { font-weight: 400; color: var(--accent); }
    .code { margin: 36px 0 6px; font-size: clamp(96px, 26vw, 168px); line-height: .95; font-weight: 700; letter-spacing: -.06em; background: linear-gradient(180deg, #fff, #8e929c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .code span { background: linear-gradient(135deg, #e9d5ff, #a855f7 55%, #7e22ce); -webkit-background-clip: text; background-clip: text; }
    h1 { font-size: clamp(22px, 5vw, 28px); letter-spacing: -.02em; margin: 8px 0 8px; font-weight: 600; }
    p { color: var(--text-2); margin: 0 0 28px; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; }
    .primary { color: #fff; background: linear-gradient(180deg, #c084fc, #9333ea); box-shadow: 0 10px 30px -10px rgba(168, 85, 247, .7); }
    .ghost { color: var(--text); border: 1px solid var(--line); background: rgba(255, 255, 255, .03); }
    a.btn:hover { filter: brightness(1.08); }
