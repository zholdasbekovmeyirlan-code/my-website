# Бәрі on your own server (for example a VPS in Kazakhstan). HTTPS certificates come automatically from Caddy.
#   cp env.example .env   # then edit it
#   docker compose up -d --build
services:
  app:
    build: ..
    restart: always
    env_file: .env
    environment:
      DB_PATH: /data/bari.db
    volumes:
      - bari-data:/data
  caddy:
    image: caddy:2
    restart: always
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  bari-data:
  caddy-data:
  caddy-config:
